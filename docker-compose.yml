version: "3.9"

services:
  web:
    build: .
    container_name: django_app

    command: >
      gunicorn grievance.wsgi:application
      --bind 0.0.0.0:8000
      --workers 1

    env_file:
      - .env

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_started

    restart: unless-stopped

  db:
    image: postgres:15

    container_name: postgres_db

    env_file:
      - .env

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

volumes:
  postgres_data: